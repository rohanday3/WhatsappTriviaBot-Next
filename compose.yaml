services:
  trivia-bot:
    build: .
    container_name: whatsapp-trivia
    restart: unless-stopped
    env_file: .env
    environment:
      HEALTH_HOST: 0.0.0.0
      DATABASE_PATH: /app/var/trivia.db
    volumes:
      - trivia-data:/app/var
    ports:
      - "127.0.0.1:8787:8787"
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  trivia-data:
